<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie & Book Collection Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <h1>Movie & Book Collection Manager</h1>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            {% if session.get("user_id") %}
                <span class="nav-user">Hi, {{ session.get("username") }}</span>
                <a href="/logout">Logout</a>
            {% else %}
                <a href="/signin">Sign In</a>
                <a href="/signup">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
